<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <style>
    .wave1 { animation: drift 10s ease-in-out infinite alternate; }
    .wave2 { animation: drift 14s ease-in-out infinite alternate-reverse; }
    .title { font: 700 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; animation: fade 1.2s ease-out both; }
    .sub   { font: 500 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 4px; animation: fade 1.2s ease-out .4s both; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    @keyframes fade  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <g class="wave2" opacity="0.35">
    <path fill="#7c3aed" d="M0 200 C 200 160, 400 240, 600 200 S 1000 160, 1260 200 L 1260 260 L 0 260 Z"/>
  </g>
  <g class="wave1" opacity="0.6">
    <path fill="#0d1117" d="M0 225 C 220 195, 420 255, 640 225 S 1040 195, 1260 225 L 1260 260 L 0 260 Z"/>
  </g>
  <text x="600" y="110" text-anchor="middle" class="title" fill="url(#txt)">Tarunya Yadav</text>
  <text x="600" y="155" text-anchor="middle" class="sub" fill="#c4b5fd">FULL-STACK &amp; AI ENGINEER</text>
</svg>
